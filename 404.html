<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="robots" content="noindex, follow">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

<body>
  <main class="nf wrap">
    <p class="display nf-code" aria-hidden="true">404</p>
    <h1 class="display">Page not found</h1>
    <p class="nf-lead">The DKIM record or page you're looking for doesn't exist.</p>
    <ul class="nf-links">
      <li><a class="link" href="/">Back to DKIM Inspector</a></li>
      <li><a class="link" href="/sitemap.xml">Sitemap</a></li>

    </ul>
    <p class="nf-log" aria-hidden="true"><span class="dim">$ </span>dig TXT this-path<br><span class="err">no record for this path</span></p>
  </main>
  <script src="/404.js?v=1"></script>
